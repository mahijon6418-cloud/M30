name: Build OVPN30

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OVPN30 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout M30
        uses: actions/checkout@v4

      - name: Checkout OpenVPN XOR
        uses: actions/checkout@v4
        with:
          repository: lawtancool/ics-openvpn-xor
          ref: v0.7.37-xor
          submodules: recursive
          path: upstream

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-32
            build-tools;32.0.0
            ndk;24.0.8215888
          accept-android-sdk-licenses: true
          mkdir -p upstream/main/src/ui/java/de/blinkt/openvpn/activities
          mkdir -p upstream/main/src/main/res/drawable

          cp OVPN30Activity.java \
            upstream/main/src/ui/java/de/blinkt/openvpn/activities/OVPN30Activity.java

          cp ovpn30_icon.xml \
            upstream/main/src/main/res/drawable/ovpn30_icon.xml

      - name: Patch launcher
        run: |
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          A = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", A)

          manifest = Path(
              "upstream/main/src/ui/AndroidManifest.xml"
          )

          tree = ET.parse(manifest)
          root = tree.getroot()

          found = False

          for activity in root.findall(".//activity"):
              name = activity.get(
                  f"{{{A}}}name",
                  ""
              )

              if name == ".activities.MainActivity":
                  activity.set(
                      f"{{{A}}}name",
                      ".activities.OVPN30Activity"
                  )
                  found = True

          if not found:
              raise SystemExit(
                  "MainActivity launcher not found"
              )

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          print("OVPN30 launcher installed")
          PY

      - name: Patch app name and icon
        run: |
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          A = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", A)

          for filename in [
              "upstream/main/src/main/AndroidManifest.xml",
              "upstream/main/src/ui/AndroidManifest.xml"
          ]:

              path = Path(filename)

              tree = ET.parse(path)
              root = tree.getroot()

              app = root.find("application")

              if app is not None:
                  app.set(
                      f"{{{A}}}label",
                      "OVPN30"
                  )

                  app.set(
                      f"{{{A}}}icon",
                      "@drawable/ovpn30_icon"
                  )

              tree.write(
                  path,
                  encoding="utf-8",
                  xml_declaration=True
              )

          print("Manifest patched")
          PY

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build APK
        working-directory: upstream
        run: |
          chmod +x gradlew

          ./gradlew \
            :main:assembleUiRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          set -e

          mkdir -p release

          APK=$(find \
            upstream/main/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp "$APK" release/OVPN30-Scramble.apk

          ls -lh release/OVPN30-Scramble.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OVPN30-Scramble
          path: release/OVPN30-Scramble.apk
          if-no-files-found: error
          retention-days: 30
