name: Build OVPN30 Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build OVPN30 Custom UI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout OVPN30
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-32" \
            "build-tools;32.0.0" \
            "ndk;24.0.8215888"

      # IMPORTANT:
      # Do NOT change v0.7.37-xor to master.
      - name: Checkout OpenVPN XOR engine
        uses: actions/checkout@v4
        with:
          repository: lawtancool/ics-openvpn-xor
          ref: v0.7.37-xor
          submodules: recursive
          path: upstream

      - name: Create signing keystore
        shell: bash
        run: |
          set -e

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ovpn30.keystore" \
            -alias ovpn30 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ovpn30password \
            -keypass ovpn30password \
            -dname "CN=OVPN30,O=OVPN30,C=US"

      # ==========================================================
      # OVPN30 CUSTOM DASHBOARD
      # ==========================================================
      - name: Install OVPN30 custom dashboard
        shell: bash
        run: |
          set -e

          mkdir -p upstream/main/src/ui/java/de/blinkt/openvpn/activities
          mkdir -p upstream/main/src/main/res/drawable

          cat > upstream/main/src/ui/java/de/blinkt/openvpn/activities/OVPN30Activity.java <<'JAVA'
package de.blinkt.openvpn.activities;

import android.app.Activity;
import android.content.Intent;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.net.Uri;
import android.os.Bundle;
import android.view.Gravity;
import android.view.ViewGroup;
import android.widget.Button;
import android.widget.FrameLayout;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

import de.blinkt.openvpn.LaunchVPN;
import de.blinkt.openvpn.R;
import de.blinkt.openvpn.VpnProfile;
import de.blinkt.openvpn.core.ProfileManager;
import de.blinkt.openvpn.core.VpnStatus;
import de.blinkt.openvpn.activities.ConfigConverter;
import de.blinkt.openvpn.activities.DisconnectVPN;
import de.blinkt.openvpn.activities.FileSelect;
import de.blinkt.openvpn.activities.LogWindow;
import de.blinkt.openvpn.fragments.VPNProfileList;

public class OVPN30Activity extends BaseActivity {

    private static final int SELECT_PROFILE = 430;
    private static final int IMPORT_PROFILE = 431;

    private LinearLayout root;
    private TextView statusText;
    private TextView profileCount;
    private TextView connectionDot;

    private int dp(float value) {
        return (int) (
                value * getResources().getDisplayMetrics().density + 0.5f
        );
    }

    private GradientDrawable rounded(int color, float radius) {
        GradientDrawable d = new GradientDrawable();
        d.setColor(color);
        d.setCornerRadius(dp(radius));
        return d;
    }

    private TextView text(
            String value,
            float size,
            int color,
            boolean bold
    ) {
        TextView t = new TextView(this);

        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(color);
        t.setGravity(Gravity.CENTER_VERTICAL);

        t.setTypeface(
                Typeface.create(
                        "sans-serif",
                        bold ? Typeface.BOLD : Typeface.NORMAL
                )
        );

        return t;
    }

    private LinearLayout card() {

        LinearLayout c = new LinearLayout(this);

        c.setOrientation(LinearLayout.VERTICAL);

        c.setPadding(
                dp(18),
                dp(16),
                dp(18),
                dp(16)
        );

        c.setBackground(
                rounded(
                        Color.rgb(15, 24, 40),
                        20
                )
        );

        c.setElevation(dp(3));

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.WRAP_CONTENT
                );

        p.setMargins(
                0,
                dp(7),
                0,
                dp(7)
        );

        c.setLayoutParams(p);

        return c;
    }

    private Button action(String label) {

        Button b = new Button(this);

        b.setText(label);
        b.setTextSize(15);
        b.setTextColor(Color.WHITE);
        b.setAllCaps(false);
        b.setGravity(Gravity.CENTER);

        b.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        b.setPadding(
                dp(12),
                dp(4),
                dp(12),
                dp(4)
        );

        b.setBackground(
                rounded(
                        Color.rgb(24, 116, 235),
                        16
                )
        );

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        dp(54)
                );

        p.setMargins(
                0,
                dp(6),
                0,
                dp(6)
        );

        b.setLayoutParams(p);

        return b;
    }

    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        if (getSupportActionBar() != null) {
            getSupportActionBar().hide();
        }

        getWindow().setStatusBarColor(
                Color.rgb(5, 8, 15)
        );

        getWindow().setNavigationBarColor(
                Color.rgb(5, 8, 15)
        );

        buildDashboard();
    }

    @Override
    protected void onResume() {

        super.onResume();

        if (root != null) {
            refreshStatus();
        }
    }

    private void buildDashboard() {

        FrameLayout frame = new FrameLayout(this);

        frame.setBackgroundColor(
                Color.rgb(5, 8, 15)
        );

        ScrollView scroll = new ScrollView(this);

        scroll.setFillViewport(true);

        root = new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                dp(18),
                dp(20),
                dp(18),
                dp(24)
        );

        TextView brand =
                text(
                        "OVPN30",
                        31,
                        Color.WHITE,
                        true
                );

        brand.setLetterSpacing(0.08f);

        root.addView(
                brand,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        dp(48)
                )
        );

        TextView subtitle =
                text(
                        "OPENVPN • SCRAMBLE EDITION",
                        11,
                        Color.rgb(86, 157, 255),
                        true
                );

        subtitle.setLetterSpacing(0.12f);

        root.addView(
                subtitle,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        dp(28)
                )
        );

        // STATUS CARD
        LinearLayout statusCard = card();

        LinearLayout statusRow =
                new LinearLayout(this);

        statusRow.setGravity(
                Gravity.CENTER_VERTICAL
        );

        statusRow.setOrientation(
                LinearLayout.HORIZONTAL
        );

        connectionDot =
                text(
                        "●",
                        25,
                        Color.rgb(255, 184, 77),
                        false
                );

        statusRow.addView(
                connectionDot,
                new LinearLayout.LayoutParams(
                        dp(38),
                        dp(42)
                )
        );

        LinearLayout statusWords =
                new LinearLayout(this);

        statusWords.setOrientation(
                LinearLayout.VERTICAL
        );

        TextView statusTitle =
                text(
                        "VPN STATUS",
                        10,
                        Color.rgb(125, 145, 170),
                        true
                );

        statusWords.addView(statusTitle);

        statusText =
                text(
                        "Ready to connect",
                        18,
                        Color.WHITE,
                        true
                );

        statusWords.addView(statusText);

        statusRow.addView(
                statusWords,
                new LinearLayout.LayoutParams(
                        0,
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        1
                )
        );

        profileCount =
                text(
                        "0 profiles",
                        12,
                        Color.rgb(145, 165, 190),
                        false
                );

        statusRow.addView(profileCount);

        statusCard.addView(statusRow);

        root.addView(statusCard);

        // MAIN CONNECT BUTTON
        Button connect =
                action("CONNECT / PROFILES");

        connect.setOnClickListener(
                v -> connectOrProfiles()
        );

        root.addView(connect);

        // PROFILES CARD
        LinearLayout pCard = card();

        TextView pTitle =
                text(
                        "PROFILES",
                        18,
                        Color.WHITE,
                        true
                );

        pCard.addView(pTitle);

        TextView pSub =
                text(
                        "Manage, connect, edit and import your .ovpn profiles",
                        12,
                        Color.rgb(145, 165, 190),
                        false
                );

        pCard.addView(pSub);

        Button profiles =
                action("Open Profiles");

        profiles.setOnClickListener(
                v -> openProfiles()
        );

        pCard.addView(profiles);

        Button importButton =
                action("Import .OVPN");

        importButton.setBackground(
                rounded(
                        Color.rgb(22, 35, 55),
                        16
                )
        );

        importButton.setTextColor(
                Color.rgb(95, 169, 255)
        );

        importButton.setOnClickListener(
                v -> importProfile()
        );

        pCard.addView(importButton);

        root.addView(pCard);

        // TOOLS
        LinearLayout tools = card();

        tools.addView(
                text(
                        "TOOLS",
                        18,
                        Color.WHITE,
                        true
                )
        );

        Button logs =
                action("Connection Logs");

        logs.setBackground(
                rounded(
                        Color.rgb(22, 35, 55),
                        16
                )
        );

        logs.setOnClickListener(
                v -> startActivity(
                        new Intent(
                                this,
                                LogWindow.class
                        )
                )
        );

        tools.addView(logs);

        Button settings =
                action("Settings");

        settings.setBackground(
                rounded(
                        Color.rgb(22, 35, 55),
                        16
                )
        );

        settings.setOnClickListener(
                v -> openSettingsHint()
        );

        tools.addView(settings);

        root.addView(tools);

        TextView footer =
                text(
                        "OVPN30  •  OpenVPN XOR engine  •  v0.7.37-xor",
                        10,
                        Color.rgb(80, 98, 122),
                        false
                );

        footer.setGravity(Gravity.CENTER);

        footer.setPadding(
                0,
                dp(14),
                0,
                0
        );

        root.addView(footer);

        scroll.addView(root);

        frame.addView(
                scroll,
                new FrameLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.MATCH_PARENT
                )
        );

        setContentView(frame);

        refreshStatus();
    }

    private void refreshStatus() {

        boolean active =
                VpnStatus.isVPNActive();

        connectionDot.setTextColor(
                active
                        ? Color.rgb(53, 211, 123)
                        : Color.rgb(255, 184, 77)
        );

        statusText.setText(
                active
                        ? "Connected"
                        : "Ready to connect"
        );

        int count =
                ProfileManager
                        .getInstance(this)
                        .getProfiles()
                        .size();

        profileCount.setText(
                count +
                        (
                                count == 1
                                        ? " profile"
                                        : " profiles"
                        )
        );
    }

    private void connectOrProfiles() {

        if (VpnStatus.isVPNActive()) {

            startActivity(
                    new Intent(
                            this,
                            DisconnectVPN.class
                    )
            );

            return;
        }

        java.util.Collection<VpnProfile> profiles =
                ProfileManager
                        .getInstance(this)
                        .getProfiles();

        if (profiles.size() == 1) {

            VpnProfile profile =
                    profiles.iterator().next();

            Intent intent =
                    new Intent(
                            this,
                            LaunchVPN.class
                    );

            intent.putExtra(
                    LaunchVPN.EXTRA_KEY,
                    profile.getUUID().toString()
            );

            intent.setAction(
                    Intent.ACTION_MAIN
            );

            startActivity(intent);

        } else {

            openProfiles();
        }
    }

    private void openProfiles() {

        getSupportFragmentManager()
                .beginTransaction()
                .replace(
                        android.R.id.content,
                        new VPNProfileList()
                )
                .addToBackStack("profiles")
                .commit();
    }

    private void importProfile() {

        Intent intent =
                new Intent(
                        this,
                        FileSelect.class
                );

        intent.putExtra(
                FileSelect.NO_INLINE_SELECTION,
                true
        );

        intent.putExtra(
                FileSelect.WINDOW_TITLE,
                R.string.import_configuration_file
        );

        startActivityForResult(
                intent,
                SELECT_PROFILE
        );
    }

    private void openSettingsHint() {

        Toast.makeText(
                this,
                "برای تنظیمات یک پروفایل، ابتدا Profiles را باز کنید و تنظیمات همان پروفایل را انتخاب کنید.",
                Toast.LENGTH_LONG
        ).show();
    }

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data
    ) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );

        if (
                resultCode != Activity.RESULT_OK
                        || data == null
        ) {

            refreshStatus();

            return;
        }

        if (requestCode == SELECT_PROFILE) {

            String fileData =
                    data.getStringExtra(
                            FileSelect.RESULT_DATA
                    );

            if (fileData == null) {

                refreshStatus();

                return;
            }

            Uri uri =
                    new Uri.Builder()
                            .path(fileData)
                            .scheme("file")
                            .build();

            Intent startImport =
                    new Intent(
                            this,
                            ConfigConverter.class
                    );

            startImport.setAction(
                    ConfigConverter.IMPORT_PROFILE
            );

            startImport.setData(uri);

            startActivityForResult(
                    startImport,
                    IMPORT_PROFILE
            );

        } else if (
                requestCode == IMPORT_PROFILE
        ) {

            Toast.makeText(
                    this,
                    "Profile imported successfully",
                    Toast.LENGTH_SHORT
            ).show();

            refreshStatus();
        }
    }
}
JAVA

          # ======================================================
          # PATCH MANIFESTS
          # ======================================================

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", android)

          # Main manifest
          manifest = Path(
              "upstream/main/src/main/AndroidManifest.xml"
          )

          tree = ET.parse(manifest)
          root = tree.getroot()

          app = root.find("application")

          if app is None:
              raise SystemExit(
                  "Main manifest has no application element"
              )

          app.set(
              f"{{{android}}}label",
              "OVPN30"
          )

          app.set(
              f"{{{android}}}icon",
              "@drawable/ovpn30_icon"
          )

          app.set(
              f"{{{android}}}roundIcon",
              "@drawable/ovpn30_icon"
          )

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          # UI manifest
          ui_manifest = Path(
              "upstream/main/src/ui/AndroidManifest.xml"
          )

          ui_tree = ET.parse(ui_manifest)
          ui_root = ui_tree.getroot()

          launcher_changed = False

          for activity in ui_root.findall(
                  ".//activity"
          ):

              name = activity.get(
                  f"{{{android}}}name",
                  ""
              )

              intent = activity.find(
                  "intent-filter"
              )

              if (
                  name == ".activities.MainActivity"
                  and intent is not None
              ):

                  actions = [
                      x.get(
                          f"{{{android}}}name"
                      )
                      for x in intent.findall("action")
                  ]

                  cats = [
                      x.get(
                          f"{{{android}}}name"
                      )
                      for x in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN"
                      in actions
                      and
                      "android.intent.category.LAUNCHER"
                      in cats
                  ):

                      activity.set(
                          f"{{{android}}}name",
                          ".activities.OVPN30Activity"
                      )

                      launcher_changed = True

          if not launcher_changed:

              raise SystemExit(
                  "Could not find real UI launcher"
              )

          ui_tree.write(
              ui_manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              "OVPN30 launcher installed successfully"
          )
          PY

