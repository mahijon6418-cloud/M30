name: Build OVPN30

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OVPN30 APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # CHECKOUT PROJECT
      # ------------------------------------------

      - name: Checkout M30
        uses: actions/checkout@v4

      # ------------------------------------------
      # CHECKOUT OPENVPN XOR
      # IMPORTANT: DO NOT CHANGE THE TAG
      # ------------------------------------------

      - name: Checkout OpenVPN XOR
        uses: actions/checkout@v4
        with:
          repository: lawtancool/ics-openvpn-xor
          ref: v0.7.37-xor
          submodules: recursive
          path: upstream

      # ------------------------------------------
      # JAVA 17
      # ------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------
      # ANDROID SDK
      # ------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          exit 0

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-32" \
            "build-tools;32.0.0" \
            "ndk;24.0.8215888"

      # ------------------------------------------
      # INSTALL CUSTOM OVPN30 DASHBOARD
      # ------------------------------------------

      - name: Install OVPN30 dashboard
        shell: bash
        run: |
          set -e

          mkdir -p \
            upstream/main/src/ui/java/de/blinkt/openvpn/activities

          mkdir -p \
            upstream/main/src/main/res/drawable

          test -f OVPN30Activity.java

          test -f ovpn30_icon.xml

          cp \
            OVPN30Activity.java \
            upstream/main/src/ui/java/de/blinkt/openvpn/activities/OVPN30Activity.java

          cp \
            ovpn30_icon.xml \
            upstream/main/src/main/res/drawable/ovpn30_icon.xml

          echo "OVPN30 dashboard installed."

      # ------------------------------------------
      # PATCH UI LAUNCHER
      # ------------------------------------------

      - name: Patch OVPN30 launcher
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          path = Path(
              "upstream/main/src/ui/AndroidManifest.xml"
          )

          tree = ET.parse(path)
          root = tree.getroot()

          found = False

          for activity in root.findall(".//activity"):

              name = activity.get(
                  f"{{{ANDROID}}}name",
                  ""
              )

              if name == ".activities.MainActivity":

                  activity.set(
                      f"{{{ANDROID}}}name",
                      ".activities.OVPN30Activity"
                  )

                  found = True

          if not found:
              raise SystemExit(
                  "ERROR: MainActivity launcher was not found."
              )

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              "OVPN30 launcher installed successfully."
          )
          PY

      # ------------------------------------------
      # PATCH APP NAME AND ICON
      # ------------------------------------------

      - name: Patch application
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          manifests = [
              Path(
                  "upstream/main/src/main/AndroidManifest.xml"
              ),
              Path(
                  "upstream/main/src/ui/AndroidManifest.xml"
              )
          ]

          for path in manifests:

              tree = ET.parse(path)
              root = tree.getroot()

              application = root.find("application")

              if application is not None:

                  application.set(
                      f"{{{ANDROID}}}label",
                      "OVPN30"
                  )

                  application.set(
                      f"{{{ANDROID}}}icon",
                      "@drawable/ovpn30_icon"
                  )

                  application.set(
                      f"{{{ANDROID}}}roundIcon",
                      "@drawable/ovpn30_icon"
                  )

              tree.write(
                  path,
                  encoding="utf-8",
                  xml_declaration=True
              )

          print("Application name and icon patched.")
          PY

      # ------------------------------------------
      # VERIFY CUSTOM FILES
      # ------------------------------------------

      - name: Verify OVPN30 files
        shell: bash
        run: |
          set -e

          echo "===== DASHBOARD ====="

          test -f \
            upstream/main/src/ui/java/de/blinkt/openvpn/activities/OVPN30Activity.java

          echo "Dashboard OK"

          echo "===== ICON ====="

          test -f \
            upstream/main/src/main/res/drawable/ovpn30_icon.xml

          echo "Icon OK"

          echo "===== LAUNCHER ====="

          grep -n \
            "OVPN30Activity" \
            upstream/main/src/ui/AndroidManifest.xml

          echo "Launcher OK"

          echo "===== SCRAMBLE ====="

          grep -Rni \
            "scramble" \
            upstream/main/src/main/cpp \
            2>/dev/null \
            | head -30 || true

      # ------------------------------------------
      # JAVA 11
      # OLD GRADLE COMPATIBILITY
      # ------------------------------------------

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # ------------------------------------------
      # GRADLE
      # ------------------------------------------

      - name: Prepare Gradle
        working-directory: upstream
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableUnitTestBinaryResources=false
          org.gradle.jvmargs=-Xmx4096M
          org.gradle.daemon=false
          EOF

          echo "Gradle prepared."

          java -version

      # ------------------------------------------
      # BUILD
      # ------------------------------------------

      - name: Build OVPN30
        working-directory: upstream
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "======================================"
          echo "BUILDING OVPN30"
          echo "======================================"

          ./gradlew \
            :main:assembleUiRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------
      # FIND APK
      # ------------------------------------------

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find \
            upstream/main/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(
            find \
              upstream/main/build/outputs/apk \
              -type f \
              -name "*.apk" \
            | grep -E \
              "ui.*release|release.*universal|universal" \
            | head -n 1
          )

          if [ -z "$APK" ]; then

            APK=$(
              find \
                upstream/main/build/outputs/apk \
                -type f \
                -name "*.apk" \
              | head -n 1
            )

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          mkdir -p release

          cp \
            "$APK" \
            release/OVPN30-Scramble.apk

          echo ""
          echo "APK:"
          ls -lh release/OVPN30-Scramble.apk

      # ------------------------------------------
      # UPLOAD APK
      # ------------------------------------------

      - name: Upload OVPN30 APK
        uses: actions/upload-artifact@v4
        with:
          name: OVPN30-Scramble
          path: release/OVPN30-Scramble.apk
          if-no-files-found: error
          retention-days: 30
