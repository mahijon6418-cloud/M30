name: Build OVPN30

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OVPN30 APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT M30
      # ==========================================

      - name: Checkout M30
        uses: actions/checkout@v4

      # ==========================================
      # CHECKOUT OPENVPN XOR
      # IMPORTANT: KEEP THIS TAG
      # ==========================================

      - name: Checkout OpenVPN XOR
        uses: actions/checkout@v4
        with:
          repository: lawtancool/ics-openvpn-xor
          ref: v0.7.37-xor
          submodules: recursive
          path: upstream

      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # ANDROID SDK
      # Do NOT use setup-android action here
      # ==========================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "Checking sdkmanager..."

          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              2>/dev/null \
              | head -n 1 || true)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi

          echo "sdkmanager:"
          command -v sdkmanager

          echo "Accepting Android licenses..."

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-32" \
            "build-tools;32.0.0" \
            "ndk;24.0.8215888"

          echo "Android SDK ready."

      # ==========================================
      # CREATE SIGNING KEY
      # ==========================================

      - name: Create signing keystore
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ovpn30.keystore" \
            -alias ovpn30 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ovpn30password \
            -keypass ovpn30password \
            -dname "CN=OVPN30,O=OVPN30,C=US"

          echo "Keystore created."

      # ==========================================
      # INSTALL OVPN30 DASHBOARD
      # ==========================================

      - name: Install OVPN30 dashboard
        shell: bash
        run: |
          set -e

          echo "Checking custom files..."

          test -f OVPN30Activity.java
          test -f ovpn30_icon.xml

          mkdir -p \
            upstream/main/src/ui/java/de/blinkt/openvpn/activities

          mkdir -p \
            upstream/main/src/main/res/drawable

          cp \
            OVPN30Activity.java \
            upstream/main/src/ui/java/de/blinkt/openvpn/activities/OVPN30Activity.java

          cp \
            ovpn30_icon.xml \
            upstream/main/src/main/res/drawable/ovpn30_icon.xml

          echo "OVPN30 dashboard installed."

      # ==========================================
      # PATCH UI LAUNCHER
      # ==========================================

      - name: Patch OVPN30 launcher
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          path = Path(
              "upstream/main/src/ui/AndroidManifest.xml"
          )

          tree = ET.parse(path)
          root = tree.getroot()

          found = False

          for activity in root.findall(".//activity"):

              name = activity.get(
                  f"{{{ANDROID}}}name",
                  ""
              )

              if name == ".activities.MainActivity":

                  activity.set(
                      f"{{{ANDROID}}}name",
                      ".activities.OVPN30Activity"
                  )

                  found = True

          if not found:
              raise SystemExit(
                  "ERROR: MainActivity launcher not found"
              )

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              "OVPN30 launcher installed successfully."
          )
          PY

      # ==========================================
      # PATCH APPLICATION NAME + ICON
      # ==========================================

      - name: Patch application
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          manifests = [
              Path(
                  "upstream/main/src/main/AndroidManifest.xml"
              ),
              Path(
                  "upstream/main/src/ui/AndroidManifest.xml"
              )
          ]

          for path in manifests:

              tree = ET.parse(path)
              root = tree.getroot()

              application = root.find("application")

              if application is not None:

                  application.set(
                      f"{{{ANDROID}}}label",
                      "OVPN30"
                  )

                  application.set(
                      f"{{{ANDROID}}}icon",
                      "@drawable/ovpn30_icon"
                  )

                  application.set(
                      f"{{{ANDROID}}}roundIcon",
                      "@drawable/ovpn30_icon"
                  )

              tree.write(
                  path,
                  encoding="utf-8",
                  xml_declaration=True
              )

          print("Application patched.")
          PY

      # ==========================================
      # VERIFY FILES
      # ==========================================

      - name: Verify OVPN30
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "OVPN30 DASHBOARD"
          echo "================================"

          test -f \
            upstream/main/src/ui/java/de/blinkt/openvpn/activities/OVPN30Activity.java

          echo "Dashboard OK"

          echo "================================"
          echo "OVPN30 ICON"
          echo "================================"

          test -f \
            upstream/main/src/main/res/drawable/ovpn30_icon.xml

          echo "Icon OK"

          echo "================================"
          echo "OVPN30 LAUNCHER"
          echo "================================"

          grep -n \
            "OVPN30Activity" \
            upstream/main/src/ui/AndroidManifest.xml

          echo "Launcher OK"

          echo "================================"
          echo "SCRAMBLE CHECK"
          echo "================================"

          grep -Rni \
            "scramble" \
            upstream/main/src/main/cpp \
            2>/dev/null \
            | head -30 || true

      # ==========================================
      # JAVA 11
      # ==========================================

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # ==========================================
      # GRADLE SETTINGS
      # ==========================================

      - name: Prepare Gradle
        working-directory: upstream
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<EOF
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableUnitTestBinaryResources=false
          org.gradle.jvmargs=-Xmx4096M
          org.gradle.daemon=false
          keystoreFile=$RUNNER_TEMP/ovpn30.keystore
          keystorePassword=ovpn30password
          keystoreAliasPassword=ovpn30password
          keystoreAlias=ovpn30
          EOF

          echo "Gradle configured."

          java -version

      # ==========================================
      # BUILD
      # ==========================================

      - name: Build OVPN30
        working-directory: upstream
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "======================================"
          echo "BUILDING OVPN30"
          echo "======================================"

          ./gradlew \
            :main:assembleUiRelease \
            --no-daemon \
            --stacktrace

      # ==========================================
      # FIND APK
      # ==========================================

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find \
            upstream/main/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(
            find \
              upstream/main/build/outputs/apk \
              -type f \
              -name "*.apk" \
            | grep -E \
              "ui.*release|release.*universal|universal" \
            | head -n 1 || true
          )

          if [ -z "$APK" ]; then

            APK=$(
              find \
                upstream/main/build/outputs/apk \
                -type f \
                -name "*.apk" \
              | head -n 1 || true
            )

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          mkdir -p release

          cp \
            "$APK" \
            release/OVPN30-Scramble.apk

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          ls -lh \
            release/OVPN30-Scramble.apk

      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload OVPN30 APK
        uses: actions/upload-artifact@v4
        with:
          name: OVPN30-Scramble
          path: release/OVPN30-Scramble.apk
          if-no-files-found: error
          retention-days: 30
