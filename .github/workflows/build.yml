      - name: Patch application name
        shell: bash
        run: |

          python3 <<'PY'
from pathlib import Path
import xml.etree.ElementTree as ET

ANDROID = "http://schemas.android.com/apk/res/android"

ET.register_namespace(
    "android",
    ANDROID
)

files = [
    Path("upstream/main/src/main/AndroidManifest.xml"),
    Path("upstream/main/src/ui/AndroidManifest.xml")
]

for file in files:

    tree = ET.parse(file)
    root = tree.getroot()

    app = root.find("application")

    if app is not None:

        app.set(
            f"{{{ANDROID}}}label",
            "OVPN30"
        )

        app.set(
            f"{{{ANDROID}}}icon",
            "@drawable/ovpn30_icon"
        )

        app.set(
            f"{{{ANDROID}}}roundIcon",
            "@drawable/ovpn30_icon"
        )

    tree.write(
        file,
        encoding="utf-8",
        xml_declaration=True
    )

print("OVPN30 manifest patched")
PY

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Prepare Gradle
        working-directory: upstream
        run: |

          chmod +x gradlew

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<EOF
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=false
EOF

      - name: Verify scramble engine
        working-directory: upstream
        run: |

          echo "Checking XOR/Scramble source..."

          grep -Rni "scramble" \
            main/src/main/cpp \
            2>/dev/null \
            | head -30 || true

      - name: Build OVPN30
        working-directory: upstream
        run: |

          chmod +x gradlew

          ./gradlew \
            :main:assembleUiRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |

          mkdir -p release

          find upstream/main/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find \
            upstream/main/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp "$APK" \
            release/OVPN30-Scramble.apk

          ls -lh \
            release/OVPN30-Scramble.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OVPN30-Scramble
          path: release/OVPN30-Scramble.apk
          if-no-files-found: error
          retention-days: 30
