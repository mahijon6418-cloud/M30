name: Build OVPN30

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OVPN30 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout OVPN30
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-32" \
            "build-tools;32.0.0" \
            "ndk;24.0.8215888"

      - name: Checkout OpenVPN XOR
        uses: actions/checkout@v4
        with:
          repository: lawtancool/ics-openvpn-xor
          ref: v0.7.37-xor
          submodules: recursive
          path: upstream

      - name: Create OVPN30 custom UI
        shell: bash
        run: |

          set -e

          mkdir -p upstream/main/src/ui/java/de/blinkt/openvpn/activities
          mkdir -p upstream/main/src/main/res/drawable

          cat > upstream/main/src/ui/java/de/blinkt/openvpn/activities/MainActivity.java <<'JAVA'
package de.blinkt.openvpn.activities;

import android.app.Activity;
import android.content.Intent;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.net.Uri;
import android.os.Bundle;
import android.view.Gravity;
import android.view.View;
import android.view.ViewGroup;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

import java.util.Collection;

import de.blinkt.openvpn.LaunchVPN;
import de.blinkt.openvpn.R;
import de.blinkt.openvpn.VpnProfile;
import de.blinkt.openvpn.core.ProfileManager;
import de.blinkt.openvpn.core.VpnStatus;
import de.blinkt.openvpn.activities.ConfigConverter;
import de.blinkt.openvpn.activities.DisconnectVPN;
import de.blinkt.openvpn.activities.FileSelect;
import de.blinkt.openvpn.activities.LogWindow;
import de.blinkt.openvpn.fragments.VPNProfileList;

public class MainActivity extends BaseActivity {

    private static final int REQUEST_FILE = 500;
    private static final int REQUEST_IMPORT = 501;

    private LinearLayout root;
    private TextView status;
    private TextView profiles;

    private int dp(int value) {
        return (int) (
            value * getResources()
                .getDisplayMetrics()
                .density + 0.5f
        );
    }

    private GradientDrawable bg(
            int color,
            int radius
    ) {
        GradientDrawable d =
                new GradientDrawable();

        d.setColor(color);
        d.setCornerRadius(dp(radius));

        return d;
    }

    private TextView label(
            String text,
            int size,
            int color,
            boolean bold
    ) {
        TextView t =
                new TextView(this);

        t.setText(text);
        t.setTextSize(size);
        t.setTextColor(color);
        t.setGravity(
                Gravity.CENTER_VERTICAL
        );

        t.setTypeface(
                Typeface.create(
                        "sans-serif",
                        bold
                                ? Typeface.BOLD
                                : Typeface.NORMAL
                )
        );

        return t;
    }

    private Button button(
            String text
    ) {
        Button b =
                new Button(this);

        b.setText(text);
        b.setTextSize(15);
        b.setTextColor(Color.WHITE);
        b.setAllCaps(false);

        b.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        b.setBackground(
                bg(
                        Color.rgb(25, 116, 235),
                        18
                )
        );

        b.setLayoutParams(
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        dp(55)
                )
        );

        return b;
    }

    @Override
    protected void onCreate(
            Bundle state
    ) {
        super.onCreate(state);

        if (getSupportActionBar() != null) {
            getSupportActionBar().hide();
        }

        getWindow().setStatusBarColor(
                Color.rgb(5, 8, 15)
        );

        getWindow().setNavigationBarColor(
                Color.rgb(5, 8, 15)
        );

        createDashboard();
    }

    private void createDashboard() {

        ScrollView scroll =
                new ScrollView(this);

        scroll.setBackgroundColor(
                Color.rgb(5, 8, 15)
        );

        root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                dp(20),
                dp(28),
                dp(20),
                dp(30)
        );

        scroll.addView(root);

        TextView title =
                label(
                        "OVPN30",
                        34,
                        Color.WHITE,
                        true
                );

        root.addView(
                title,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(50)
                )
        );

        TextView subtitle =
                label(
                        "SECURE VPN CLIENT",
                        12,
                        Color.rgb(50, 145, 255),
                        true
                );

        root.addView(
                subtitle,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(30)
                )
        );

        LinearLayout statusCard =
                new LinearLayout(this);

        statusCard.setOrientation(
                LinearLayout.VERTICAL
        );

        statusCard.setPadding(
                dp(20),
                dp(18),
                dp(20),
                dp(18)
        );

        statusCard.setBackground(
                bg(
                        Color.rgb(15, 24, 40),
                        22
                )
        );

        LinearLayout.LayoutParams cardParams =
                new LinearLayout.LayoutParams(
                        -1,
                        -2
                );

        cardParams.setMargins(
                0,
                dp(12),
                0,
                dp(12)
        );

        root.addView(
                statusCard,
                cardParams
        );

        TextView small =
                label(
                        "CONNECTION",
                        11,
                        Color.rgb(125, 145, 170),
                        true
                );

        statusCard.addView(small);

        status =
                label(
                        "●  Ready to connect",
                        21,
                        Color.rgb(255, 190, 80),
                        true
                );

        statusCard.addView(
                status,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(48)
                )
        );

        profiles =
                label(
                        "0 profiles",
                        12,
                        Color.rgb(145, 165, 190),
                        false
                );

        statusCard.addView(profiles);

        Button connect =
                button(
                        "CONNECT"
                );

        connect.setOnClickListener(
                v -> connect()
        );

        root.addView(
                connect,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(58)
                )
        );

        addSpace(12);

        LinearLayout profileCard =
                new LinearLayout(this);

        profileCard.setOrientation(
                LinearLayout.VERTICAL
        );

        profileCard.setPadding(
                dp(18),
                dp(16),
                dp(18),
                dp(16)
        );

        profileCard.setBackground(
                bg(
                        Color.rgb(15, 24, 40),
                        22
                )
        );

        root.addView(
                profileCard,
                new LinearLayout.LayoutParams(
                        -1,
                        -2
                )
        );

        profileCard.addView(
                label(
                        "PROFILES",
                        18,
                        Color.WHITE,
                        true
                )
        );

        profileCard.addView(
                label(
                        "Manage your OpenVPN configurations",
                        12,
                        Color.rgb(145, 165, 190),
                        false
                )
        );

        addSpaceTo(
                profileCard,
                8
        );

        Button open =
                button(
                        "Open Profiles"
                );

        open.setOnClickListener(
                v -> openProfiles()
        );

        profileCard.addView(open);

        Button importButton =
                button(
                        "Import .OVPN"
                );

        importButton.setTextColor(
                Color.rgb(75, 160, 255)
        );

        importButton.setBackground(
                bg(
                        Color.rgb(22, 35, 55),
                        18
                )
        );

        importButton.setOnClickListener(
                v -> importConfig()
        );

        profileCard.addView(importButton);

        addSpace(12);

        LinearLayout tools =
                new LinearLayout(this);

        tools.setOrientation(
                LinearLayout.VERTICAL
        );

        tools.setPadding(
                dp(18),
                dp(16),
                dp(18),
                dp(16)
        );

        tools.setBackground(
                bg(
                        Color.rgb(15, 24, 40),
                        22
                )
        );

        root.addView(
                tools,
                new LinearLayout.LayoutParams(
                        -1,
                        -2
                )
        );

        tools.addView(
                label(
                        "TOOLS",
                        18,
                        Color.WHITE,
                        true
                )
        );

        Button logs =
                button(
                        "Connection Logs"
                );

        logs.setBackground(
                bg(
                        Color.rgb(22, 35, 55),
                        18
                )
        );

        logs.setOnClickListener(
                v -> startActivity(
                        new Intent(
                                this,
                                LogWindow.class
                        )
                )
        );

        tools.addView(logs);

        TextView footer =
                label(
                        "OVPN30  •  XOR SCRAMBLE",
                        10,
                        Color.rgb(75, 95, 120),
                        false
                );

        footer.setGravity(
                Gravity.CENTER
        );

        root.addView(
                footer,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(50)
                )
        );

        setContentView(scroll);

        refresh();
    }

    private void addSpace(
            int height
    ) {
        View v =
                new View(this);

        root.addView(
                v,
                new LinearLayout.LayoutParams(
                        1,
                        dp(height)
                )
        );
    }

    private void addSpaceTo(
            LinearLayout parent,
            int height
    ) {
        View v =
                new View(this);

        parent.addView(
                v,
                new LinearLayout.LayoutParams(
                        1,
                        dp(height)
                )
        );
    }

    private void refresh() {

        if (VpnStatus.isVPNActive()) {

            status.setText(
                    "●  Connected"
            );

            status.setTextColor(
                    Color.rgb(
                            50,
                            220,
                            125
                    )
            );

        } else {

            status.setText(
                    "●  Ready to connect"
            );

            status.setTextColor(
                    Color.rgb(
                            255,
                            190,
                            80
                    )
            );
        }

        Collection<VpnProfile> list =
                ProfileManager
                        .getInstance(this)
                        .getProfiles();

        int count =
                list == null
                        ? 0
                        : list.size();

        profiles.setText(
                count == 1
                        ? "1 profile"
                        : count + " profiles"
        );
    }

    private void connect() {

        if (VpnStatus.isVPNActive()) {

            startActivity(
                    new Intent(
                            this,
                            DisconnectVPN.class
                    )
            );

            return;
        }

        Collection<VpnProfile> list =
                ProfileManager
                        .getInstance(this)
                        .getProfiles();

        if (list.size() == 1) {

            VpnProfile p =
                    list.iterator().next();

            Intent i =
                    new Intent(
                            this,
                            LaunchVPN.class
                    );

            i.putExtra(
                    LaunchVPN.EXTRA_KEY,
                    p.getUUID().toString()
            );

            i.setAction(
                    Intent.ACTION_MAIN
            );

            startActivity(i);

        } else {

            openProfiles();
        }
    }

    private void openProfiles() {

        getSupportFragmentManager()
                .beginTransaction()
                .replace(
                        android.R.id.content,
                        new VPNProfileList()
                )
                .addToBackStack(
                        "profiles"
                )
                .commit();
    }

    private void importConfig() {

        Intent i =
                new Intent(
                        this,
                        FileSelect.class
                );

        i.putExtra(
                FileSelect.NO_INLINE_SELECTION,
                true
        );

        i.putExtra(
                FileSelect.WINDOW_TITLE,
                R.string.import_configuration_file
        );

        startActivityForResult(
                i,
                REQUEST_FILE
        );
    }

    @Override
    protected void onResume() {

        super.onResume();

        if (status != null) {
            refresh();
        }
    }

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data
    ) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );

        if (
                requestCode == REQUEST_FILE
                && resultCode == Activity.RESULT_OK
                && data != null
        ) {

            String file =
                    data.getStringExtra(
                            FileSelect.RESULT_DATA
                    );

            if (file != null) {

                Intent converter =
                        new Intent(
                                this,
                                ConfigConverter.class
                        );

                converter.setAction(
                        ConfigConverter.IMPORT_PROFILE
                );

                converter.setData(
                        Uri.parse(
                                "file://" + file
                        )
                );

                startActivityForResult(
                        converter,
                        REQUEST_IMPORT
                );
            }

        } else if (
                requestCode == REQUEST_IMPORT
                && resultCode == Activity.RESULT_OK
        ) {

            Toast.makeText(
                    this,
                    "Profile imported",
                    Toast.LENGTH_SHORT
            ).show();

            refresh();
        }
    }
}
JAVA

