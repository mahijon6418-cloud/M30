      # ==========================================================
      # JAVA 11 FOR OLD GRADLE
      # ==========================================================

      - name: Setup Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Prepare Gradle
        working-directory: upstream
        shell: bash
        run: |

          set -e

          chmod +x gradlew

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<EOF
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableUnitTestBinaryResources=false
          org.gradle.jvmargs=-Xmx4096M
          org.gradle.daemon=false
          keystoreFile=$RUNNER_TEMP/ovpn30.keystore
          keystorePassword=ovpn30password
          keystoreAliasPassword=ovpn30password
          keystoreAlias=ovpn30
          EOF

          java -version

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build OVPN30
        working-directory: upstream
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "BUILDING OVPN30"
          echo "======================================"

          ./gradlew \
            :main:assembleUiRelease \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # LOCATE APK
      # ==========================================================

      - name: Locate APK
        shell: bash
        run: |

          set -e

          echo "===== APK FILES ====="

          find \
            upstream/main/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(
            find \
              upstream/main/build/outputs/apk \
              -type f \
              -name "*.apk" |
            grep -E \
              "ui.*release|release.*universal|universal" |
            head -n1 || true
          )

          if [ -z "$APK" ]; then

            APK=$(
              find \
                upstream/main/build/outputs/apk \
                -type f \
                -name "*.apk" |
              head -n1 || true
            )

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: APK not found"

            exit 1

          fi

          echo "Selected APK:"
          echo "$APK"

          mkdir -p unsigned

          cp \
            "$APK" \
            unsigned/OVPN30-unsigned.apk

          ls -lh \
            unsigned/OVPN30-unsigned.apk

      # ==========================================================
      # SIGNING TOOLS
      # ==========================================================

      - name: Find Android signing tools
        shell: bash
        run: |

          set -e

          ZIPALIGN=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name zipalign |
            sort -V |
            tail -n1
          )

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner |
            sort -V |
            tail -n1
          )

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found"
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      # ==========================================================
      # ZIPALIGN
      # ==========================================================

      - name: Zipalign APK
        shell: bash
        run: |

          set -e

          mkdir -p release

          "$ZIPALIGN" \
            -f \
            -v \
            4 \
            unsigned/OVPN30-unsigned.apk \
            release/OVPN30-aligned.apk

      # ==========================================================
      # SIGN
      # ==========================================================

      - name: Sign APK
        shell: bash
        run: |

          set -e

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/ovpn30.keystore" \
            --ks-key-alias ovpn30 \
            --ks-pass pass:ovpn30password \
            --key-pass pass:ovpn30password \
            --out release/OVPN30-Scramble.apk \
            release/OVPN30-aligned.apk

          echo "Signed APK:"
          ls -lh \
            release/OVPN30-Scramble.apk

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify APK
        shell: bash
        run: |

          set -e

          APK="release/OVPN30-Scramble.apk"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          unzip -t \
            "$APK" >/dev/null

          echo ""
          echo "===== FINAL APK ====="

          ls -lh "$APK"

          echo ""
          echo "===== SHA256 ====="

          sha256sum "$APK"

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload OVPN30 APK
        uses: actions/upload-artifact@v4

        with:

          name: OVPN30-Scramble-Signed

          path: release/OVPN30-Scramble.apk

          if-no-files-found: error

          retention-days: 30
